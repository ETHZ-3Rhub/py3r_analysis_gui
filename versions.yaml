# Pinned dependency versions for the packaging build.
#
# When cutting a release, update the commit hash to the desired version,
# then run the build workflow.  The CI script assembles the final installer.

dependencies:

  bohacek_lab_pose_models:
    repo: https://github.com/ETHZ-INS/BohacekLabPoseModels.git
    commit: 92942ee5c71f4b2661cd38a94fcab8437525e431
    # Contains large model weights stored in git-lfs.
    # The build script must run `git lfs pull` after cloning.
    lfs: true

  # Pinned versions for tracking_env, read by app/tracking_env_setup.py.
  # Bump these together when updating the tracking stack.
  tracking:
    torch: "2.12.0"
    torchvision: "0.27.0"
    ultralytics: "8.4.60"
    lap: "0.5.13"
