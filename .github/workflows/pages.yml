name: Deploy download page and docs

on:
  release:
    types: [published, released]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate download page
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python docs-site/generate.py docs-site/_build

      - name: Build documentation
        run: |
          pip install "mkdocs<2" "mkdocs-material<10"
          mkdocs build -d docs-site/_build/docs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/_build

      - id: deployment
        uses: actions/deploy-pages@v4
