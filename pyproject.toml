[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "py3r-analysis-gui"
version = "0.2.0"
description = "Simple GUI for py3r behaviour analysis pipelines"
authors = [{ name = "Tom Lorimer" }]
requires-python = ">=3.11"
dependencies = [
    "PyQt6>=6.6,<7.0",
    "openpyxl>=3.1,<4.0",
    "numpy>=2.0",
    "pandas>=2.0,<3.0",
    "pyyaml>=6.0",
    "uv>=0.5",
    "py3r-behaviour",   # installed from ../py3r_behaviour in dev; bundled in release
]

[project.scripts]
py3r-gui = "app.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[project.optional-dependencies]
dev = [
    "pre-commit>=4.0,<5.0",
    "ruff==0.8.4",   # must match rev: in .pre-commit-config.yaml
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
