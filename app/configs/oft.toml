name = "Open Field Test"
arena_image = "oft_arena.png"

[models.environment]
weights = "environment/environment_main"
instances = [{ type = "oft", max = 1 }]
stride = [30, "ffill"]
batch = 32

[models.mouse]
weights = "mouse/mouse_top_main"
instances = [{ type = "mouse_top", max = 1 }]
batch = 32

[loader]
format = "yolo3r"
fps = 30
group_tag = "group"

[script]
entry = "oft:run"
arena_size_m = 0.64
likelihood_min = 0.9

[script.options]
numbins = { min = 2, max = 20 }
n_clusters = { default = 10, min = 5, max = 50 }
