name = "Elevated Plus Maze"
arena_image = "epm_arena.png"

[models.environment]
weights = "environment_main"
instances = [{ type = "epm", max = 1 }]
stride = [30, "ffill"]
batch = 32

[models.mouse]
weights = "mouse_top_main"
instances = [{ type = "mouse_top", max = 1 }]
batch = 32

[loader]
format = "yolo3r"
fps = 30
group_tag = "group"

[script]
entry = "epm:run"
arena_diagonal_m = 0.665
likelihood_min = 0.9

[script.options]
numbins = { min = 2, max = 20 }
n_clusters = { default = 10, min = 5, max = 50 }
