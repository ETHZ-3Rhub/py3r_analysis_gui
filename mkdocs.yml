site_name: Analys3R  # overwritten at build time by mkdocs_hooks.py
site_description: Help documentation for Analys3R
docs_dir: docs_src
site_dir: docs

# Docs are opened locally via file:// (app/window.py's Help button), not
# served over HTTP — directory-style links ("scripts/") show a raw file
# listing instead of resolving to index.html, so link straight to the file.
use_directory_urls: false

theme:
  name: material
  logo: img/icon.png
  favicon: img/icon.png
  palette:
    scheme: default
    primary: black
  features:
    - content.code.copy
    - toc.integrate

hooks:
  - mkdocs_hooks.py

nav:
  - Overview: index.md
  - Configs: configs.md
  - Models: models.md
  - Scripts: scripts.md
